# 应用识别规则库（参照 Panabit 的 应用大类 → 应用小类 → 应用 三级结构）
# domains: 后缀匹配（douyin.com 同时匹配 www.douyin.com）。先匹配终端查询的域名，再匹配 CNAME。
# cidrs:   目的 IP 段（没有 DNS 记录时使用）
# ports:   "tcp/443"、"udp/3478-3481" 形式，最后兜底
# protos:  IP 协议号（1=ICMP、47=GRE、50=ESP、58=ICMPv6）
# asns:    IP 段所属的自治系统号（需要 IP→ASN 库，见 app/asn.py）；只标整个 ASN 都属于这家公司的
# 欢迎通过 PR 补充；用户也可以在 识别规则 页添加自定义规则（优先级最高）。
#
# 已发布过的应用 ID 和分类 ID 不要删除或改名：历史流量按应用 ID 存储。
# 应用不再使用时，保留条目、清空 domains 即可。

# 大类照维盟 WayOS「DPI 协议」的 17 类（debug12），顺序即显示顺序，固定列出、不管有没有流量。
