# 应用识别规则库
# domains: 后缀匹配（douyin.com 同时匹配 www.douyin.com）。先匹配终端查询的域名，再匹配 CNAME。
# cidrs:   目的 IP 段（没有 DNS 记录时使用）
# ports:   "tcp/443"、"udp/3478-3481" 形式，最后兜底
# 欢迎通过 PR 补充；用户也可以在 设置 → 识别规则 里添加自定义规则（优先级最高）。

