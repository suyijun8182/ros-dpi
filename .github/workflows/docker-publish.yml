name: Test, build and publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 连续 PR 更新时取消过期的构建（多架构镜像构建很慢）；main / tag 不取消，
# 否则发版 job 可能在上传资产途中被下一次 push 打断（同一 ref 仍然排队，只保留最新一次待运行）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Setup wizard on real MySQL
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_ROOT_PASSWORD: rootpw
        # 失败时把报错摘要写进公开注释，便于不登录也能看到原因；先把密码 mask 掉，摘要里不会出现
        run: |
          echo "::add-mask::${MYSQL_ROOT_PASSWORD}"
          set +e
          python -m pytest -q -x tests_mysql -p no:cacheprovider 2>&1 | tee /tmp/mysql-test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            msg=$(grep -E "^E |Error|assert|FAILED" /tmp/mysql-test.log | tail -25 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=MySQL wizard test::${msg}"
          fi
          exit $rc
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build (含 i18n 检查)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # PR 也构建一次镜像（单架构、不推送）：Dockerfile 破损在 PR 阶段就能发现，不用等到 push main
  docker-smoke:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 推送到 GHCR 需要 packages:write
    permissions:
      contents: read
      packages: write
    env:
      # 用户名不是敏感信息，放在 Secrets 或 Variables 里都可以
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && (secrets.DOCKERHUB_USERNAME != '' || vars.DOCKERHUB_USERNAME != '') }}
    steps:
      # 只报告各项是否存在及长度，不输出内容，用于排查 Docker Hub 没推送的问题
      - name: Check Docker Hub settings
        env:
          S_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          S_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          V_USER: ${{ vars.DOCKERHUB_USERNAME }}
          V_TOKEN: ${{ vars.DOCKERHUB_TOKEN }}
        run: |
          for n in S_USER S_TOKEN V_USER V_TOKEN; do v="${!n}"; echo "$n: ${#v} chars"; done
          echo "HAS_DOCKERHUB=$HAS_DOCKERHUB"
          if [ "$HAS_DOCKERHUB" != "true" ]; then
            echo "::warning::Docker Hub 未启用：在 Settings → Secrets and variables → Actions → Secrets 添加 DOCKERHUB_TOKEN 与 DOCKERHUB_USERNAME"
          fi

      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 没配置 DOCKERHUB_* secrets 时只推 GHCR
      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names
        id: images
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ros-dpi"
            [ "$HAS_DOCKERHUB" = "true" ] && echo "suyijun8182/ros-dpi"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # 版本号读自代码（backend/app/__init__.py）：主线提交也自动带版本标签（含 major.minor 浮动标签），不用手工打 git 标签
      - name: App version
        id: appver
        run: |
          VER=$(grep __version__ backend/app/__init__.py | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | head -1)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "minor=${VER%.*}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.appver.outputs.version }}
            type=raw,value=${{ steps.appver.outputs.minor }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Linux 单文件二进制（debug18）：与 Docker 并行的第二种部署形态；amd64 / arm64 各用原生 runner 构建
  # （PyInstaller 不能交叉编译）。这里只产出构建产物，发版由下面的 release job 统一处理
  linux-binary:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build Linux binary
        run: |
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller ros-dpi.spec
          mkdir -p pkg
          install -m 755 dist/ros-dpi pkg/ros-dpi
          tar -czf "ros-dpi-linux-${{ matrix.arch }}.tar.gz" -C pkg ros-dpi
      - uses: actions/upload-artifact@v4
        with:
          name: ros-dpi-linux-${{ matrix.arch }}
          path: ros-dpi-linux-${{ matrix.arch }}.tar.gz

  # GitHub Release：测试通过、两个架构的二进制都就绪后才建（先草稿 → 上传 tar 包 + SHA256SUMS → 发布）
  release:
    needs: [test, linux-binary]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  # 把 DOCKERHUB.md 同步到 Docker Hub 的 Overview。独立 job：失败不影响镜像发布。
  # 用社区维护的 action（跟进 Docker Hub 认证接口变化），出错时原因会写进任务注释。
  dockerhub-overview:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Sync Docker Hub overview (DOCKERHUB.md)
        if: env.HAS_TOKEN == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: suyijun8182/ros-dpi
          readme-filepath: ./DOCKERHUB.md
          short-description: "RouterOS per-device traffic & app (DPI) stats via IPFIX + DNS. RouterOS 终端流量与应用统计"
