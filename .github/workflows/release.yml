name: GitHub Release

# 推送 v* tag 时创建 GitHub Release，正文取自 CHANGELOG.md 对应版本段落。
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          NOTES=$(awk -v v="## [$VER]" 'index($0,v)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error title=CHANGELOG 缺少 [$VER] 段落::推 tag 前先在 CHANGELOG.md 里写好这个版本的说明"
            exit 1
          fi
          {
            echo '### 升级'
            echo
            echo '```bash'
            echo 'docker compose pull && docker compose up -d'
            echo '```'
            echo
            echo "$NOTES"
          } > notes.md
          gh release view "$TAG" >/dev/null 2>&1 && { echo "已存在 $TAG"; exit 0; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
