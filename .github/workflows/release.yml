name: GitHub Release

# 推送 v* tag 时创建 GitHub Release；主线提交时若代码版本号还没发过 Release，也自动补上（正文取自 CHANGELOG.md 对应段落）。
on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(sed -n 's/__version__ = "\(.*\)"/\1/p' backend/app/__init__.py | head -1)
            TAG="v${VER}"
          fi
          VER="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          NOTES=$(awk -v v="## [$VER]" 'index($0,v)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error title=CHANGELOG 缺少 [$VER] 段落::推 tag 前先在 CHANGELOG.md 里写好这个版本的说明"
            exit 1
          fi
          {
            echo '### 升级'
            echo
            echo '```bash'
            echo 'docker compose pull && docker compose up -d'
            echo '```'
            echo
            echo "$NOTES"
          } > notes.md
          gh release create "$TAG" --target "${GITHUB_SHA}" --title "$TAG" --notes-file notes.md
